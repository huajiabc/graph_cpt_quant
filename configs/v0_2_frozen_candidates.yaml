experiment:
  name: v0_2_execution_reality_check
  source_config: configs/v0.yaml
  universe_col: universe_dynamic_monthly_top30
  final_holdout_only: true

candidates:
  - candidate: C1_momentum_e7_reclaim_vol
    path_name: momentum_ignition
    signal_col: momentum_ignition_signal_event
    entry_policy: E7_pullback_1.0pct_then_reclaim_signal_close_valid_8_bars
    execution_rule: vol_regime_fast
    priority: observation
    rationale: Highest v0.1 5bp net, but only 100 trades and more complex entry.

  - candidate: C2_short_squeeze_e4_pullback_swing
    path_name: short_squeeze
    signal_col: short_squeeze_signal_event
    entry_policy: E4_pullback_0.5pct_valid_4_bars
    execution_rule: swing
    priority: primary_attack_candidate
    rationale: Best balance of sample size, mechanism clarity, and v0.1 expectancy.

  - candidate: C3_momentum_e5_pullback_swing
    path_name: momentum_ignition
    signal_col: momentum_ignition_signal_event
    entry_policy: E5_pullback_1.0pct_valid_8_bars
    execution_rule: swing
    priority: secondary_attack_candidate
    rationale: Good v0.1 expectancy with deeper pullback and moderate sample size.

  - candidate: C4_short_squeeze_e5_pullback_vol
    path_name: short_squeeze
    signal_col: short_squeeze_signal_event
    entry_policy: E5_pullback_1.0pct_valid_8_bars
    execution_rule: vol_regime_fast
    priority: conservative_short_squeeze_variant
    rationale: E4 fallback if shallow pullback fill stress fails.

fill_policies:
  optimistic:
    touch_buffer_bps: 0
    mode: limit_touch
  normal_2bp:
    touch_buffer_bps: 2
    mode: limit_touch
  conservative_5bp:
    touch_buffer_bps: 5
    mode: limit_touch
  reclaim_market:
    touch_buffer_bps: 0
    mode: reclaim_market

cost_bps: [5, 10, 20]
max_positions: [1, 3, 5, 10]
rankings:
  - clean_path_score
  - volume
  - lower_risk_first
