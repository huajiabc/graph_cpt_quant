experiment:
  name: v0_5_paper_live
  mode: paper_live
  candidate: C2_G3_BTC_UP_SHORT_SQUEEZE_PULLBACK
  timezone: UTC
  base_interval: 15m

exchange:
  name: bybit
  market: linear_usdt_perp

universe:
  mode: dynamic_top30_monthly_lock
  min_listing_age_days: 365
  exclude_stablecoins: true
  turnover_rank_30d_max: 30
  transient_hot:
    enabled: true
    turnover_rank_30d_max: 30
    turnover_rank_90d_min: 50

regime:
  btc_gate:
    enabled: true
    required_state: BTC_up
  shadow_states:
    - BTC_chop
    - BTC_down

signal:
  path: C2_short_squeeze
  frozen: true

entry:
  type: pullback
  pullback_pct: 0.005
  valid_bars: 4
  fill_models:
    - normal_2bp
    - conservative_5bp

exit:
  type: swing
  tp: 0.05
  sl: 0.03
  max_hold_bars: 48

costs:
  single_side_bps:
    - 5
    - 10
    - 20

portfolio:
  primary_max_positions: 3
  shadow_max_positions:
    - 1
    - 5
    - 10
  one_position_per_symbol: true
  pyramiding: false
  sizing: equal_notional
  ranking:
    - higher_trailing_30d_turnover
    - non_transient_hot
    - earlier_armed_time
    - symbol_lexicographic

logging:
  save_signals: true
  save_trades: true
  save_skipped: true
  save_daily_summary: true

stops:
  disable_if_btc_not_up: true
  stale_data_bars: 2
  rolling_trade_window: 100
  pause_if_rolling_10bp_net_lte_zero: true
  pause_if_matched_lift_lte_zero: true
